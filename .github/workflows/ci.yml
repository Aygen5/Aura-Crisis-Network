name: Aura Crisis Network CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore NuGet Packages
        run: dotnet restore backend/AuraCrisisNetwork.slnx

      - name: Build Backend Solution
        run: dotnet build backend/AuraCrisisNetwork.slnx --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test backend/AuraCrisisNetwork.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build
